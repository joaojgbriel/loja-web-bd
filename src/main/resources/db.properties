# Configuração do banco de dados.
#
# Por padrão usamos o H2 em modo arquivo: o banco é criado sozinho na pasta
# "lojaweb-db" dentro da pasta do usuário (~), sem precisar instalar nada.
# AUTO_SERVER=TRUE deixa abrir o mesmo banco por mais de um processo ao mesmo tempo.
#
# Para usar MySQL, troque por (e adicione o driver mysql-connector-j no pom.xml):
#   db.driver=com.mysql.cj.jdbc.Driver
#   db.url=jdbc:mysql://localhost:3306/lojaweb
#   db.usuario=root
#   db.senha=sua_senha

db.driver=org.h2.Driver
db.url=jdbc:h2:~/lojaweb-db/lojaweb;AUTO_SERVER=TRUE
db.usuario=sa
db.senha=
